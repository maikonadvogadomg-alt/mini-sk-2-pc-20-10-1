<!doctype html>
<!-- SK-HUB -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mini-SK-2-PC-20-10 (1)</title>
  <style>
    :root{--bg:#0f1420;--card:#171e30;--line:#263048;--tx:#e6ebf5;--mut:#8a96b0;--acc:#4f8cff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 24px}
    header{position:sticky;top:0;background:var(--bg);padding:16px 16px 10px;z-index:2;border-bottom:1px solid var(--line);text-align:center}
    .logo{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:var(--acc);color:var(--bg);font:bold 34px Georgia,serif;box-shadow:0 0 30px color-mix(in srgb,var(--acc) 35%,transparent);border:2px solid #fff}
    h1{margin:0;font-size:20px;letter-spacing:2px;text-transform:uppercase}.sub{color:var(--acc);font-size:12px;letter-spacing:2px;margin:4px 0 10px}
    input{width:100%;max-width:560px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;padding:16px;max-width:1200px;margin:0 auto}
    a.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--tx);padding:14px 6px;border-radius:14px;border:1px solid transparent;transition:.15s}
    a.app:hover,a.app:focus{background:var(--card);border-color:var(--line);outline:none;transform:translateY(-2px)}
    .ic{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:23px;color:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.3)}
    .ic.em{background:var(--card)!important;border:1px solid var(--line);font-size:32px}
    .ic img{width:100%;height:100%;object-fit:cover}
    .nm{font-size:12.5px;text-align:center;line-height:1.25;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .ds{font-size:10.5px;color:var(--mut);text-align:center}
    .vazio{color:var(--mut);padding:30px 16px;text-align:center;grid-column:1/-1}
    .info{text-align:center;color:var(--mut);font-size:12px;margin-top:10px}
    .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 16px}
    .links a{color:var(--tx);text-decoration:none;font-size:13px;padding:9px 16px;border:1px solid var(--line);border-radius:30px}
    .links a:hover{background:var(--acc);color:var(--bg)}
    #inst{position:fixed;right:16px;bottom:16px;padding:13px 20px;border:0;border-radius:40px;background:var(--acc);color:var(--bg);font-weight:bold;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.4);display:none;cursor:pointer}
  </style>
  <!-- PWA:inicio (gerado pelo Mini SK — pode refazer no painel 📱 PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mini-SK-2-PC">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      addEventListener('load', function () { navigator.serviceWorker.register('service-worker.js').catch(function (e) { console.warn('Service worker:', e); }); });
    }
  </script>
  <!-- PWA:fim -->
</head>
<body>
  <header><h1>Mini-SK-2-PC-20-10 (1)</h1><input id="q" type="search" placeholder="Procurar entre 1 apps…" autocomplete="off"><div class="info" id="info"></div></header>
  <main class="grid" id="g"></main>
  <button id="inst">📥 Instalar app</button>
  <script>
    // Lista gravada pelo Mini SK — está DENTRO deste arquivo, não no navegador.
    // Funciona igual em qualquer celular e depois de instalar.
    var APPS = [
 {
  "n": "Mini SK 2",
  "d": "",
  "u": "app/index.html",
  "i": "app/icons/icon.svg",
  "e": "",
  "c": "hsl(163 62% 48%)",
  "l": "MS"
 }
];
    var g = document.getElementById('g'), q = document.getElementById('q');
    function rec(){ try { return JSON.parse(localStorage.getItem('hub-recentes') || '[]'); } catch (e) { return []; } }
    function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    function card(a){ var ic = a.e ? '<span class="ic em">' + esc(a.e) + '</span>' : '<span class="ic" style="background:' + a.c + '">' + (a.i ? '<img src="' + esc(a.i) + '" alt="" loading="lazy" onerror="this.parentNode.textContent=\'' + esc(a.l) + '\'">' : esc(a.l)) + '</span>';
      return '<a class="app" href="' + esc(a.u) + '" data-u="' + esc(a.u) + '">' + ic + '<span class="nm">' + esc(a.n) + '</span>' + (a.d ? '<span class="ds">' + esc(a.d) + '</span>' : '') + '</a>'; }
    function show(){ var t = q.value.trim().toLowerCase(); var r = rec(); var list = APPS.filter(function(a){ return !t || (a.n + ' ' + a.d + ' ' + a.u).toLowerCase().indexOf(t) >= 0; });
      if (!t) list.sort(function(a,b){ var x = r.indexOf(a.u), y = r.indexOf(b.u); return (x < 0 ? 999 : x) - (y < 0 ? 999 : y); });
      g.innerHTML = list.map(card).join('') || '<p class="vazio">Nada encontrado.</p>';
      document.getElementById('info').textContent = '📊 ' + APPS.length + ' apps' + (!t && r.length ? ' · os usados por último aparecem primeiro' : ''); }
    g.addEventListener('click', function(e){ var a = e.target.closest('a.app'); if (!a) return; var r = rec().filter(function(u){ return u !== a.dataset.u; }); r.unshift(a.dataset.u); try { localStorage.setItem('hub-recentes', JSON.stringify(r.slice(0, 30))); } catch (e) {} });
    q.addEventListener('input', show); show();
    var ev; addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); ev = e; document.getElementById('inst').style.display = 'block'; });
    document.getElementById('inst').onclick = function(){ if (ev) { ev.prompt(); ev = null; this.style.display = 'none'; } };
  </script>
</body>
</html>
